name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bun:
    name: check · acceptance · image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:e2e
      - run: docker build -t exponential:ci .
      - name: Verify image healthcheck metadata
        run: test "$(docker image inspect exponential:ci --format '{{json .Config.Healthcheck}}')" != "null"
      - run: E2E_IMAGE=exponential:ci CONTAINER_ENGINE=docker bun packages/server/e2e/release.ts
      - name: Enforce image size ceiling
        run: test "$(docker image inspect exponential:ci --format '{{.Size}}')" -le 135000000
      - name: Install the browser suite and Chromium
        run: |
          (cd tests/ui && bun install --frozen-lockfile)
          (cd tests/ui && node node_modules/.bin/playwright install --with-deps chromium)
      - name: Browser suite against the production server (synthetic workspace)
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 bun run test:ui
      - name: Browser suite against the release image (synthetic workspace)
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 E2E_IMAGE=exponential:ci CONTAINER_ENGINE=docker bun run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/ui/report
            tests/ui/results
          retention-days: 7

  nix:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - run: nix flake check --print-build-logs
